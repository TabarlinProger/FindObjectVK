<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Найди капибар Поиск предметов</title>
    <link rel="icon" href="favicon.ico" sizes="32x32">
    <style>
      html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #231f20; }
      #unity-canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; outline: none; touch-action: none; }
      #loading-screen { position: fixed; inset: 0; z-index: 10; background: #28552d url('loading-background.jpg') center / cover no-repeat; }
      #loading-title { position: absolute; top: 3%; left: 50%; width: min(22vw, 58vh); height: auto; transform: translateX(-50%); }
      #loading-progress { position: absolute; bottom: 4%; left: 50%; width: min(34vw, 90vh); aspect-ratio: 2172 / 572; transform: translateX(-50%); background: url('loading-frame.png') center / 100% 100% no-repeat; }
      #loading-fill-track { position: absolute; left: 15.3%; top: 43.5%; width: 69.5%; height: 26%; }
      #loading-fill { width: 100%; height: 100%; background: url('loading-fill.png') center / 100% 100% no-repeat; clip-path: inset(0 100% 0 0); transition: clip-path .15s linear; }
      #loading-error { position: absolute; top: 38%; left: 10%; right: 10%; text-align: center; color: white; font: bold 20px sans-serif; text-shadow: 1px 2px 3px black; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
    <div id="loading-screen" role="status" aria-label="Загрузка игры">
      <img id="loading-title" src="loading-title-ru.png" alt="Загрузка…">
      <div id="loading-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="loading-fill-track"><div id="loading-fill"></div></div></div>
      <p id="loading-error" hidden></p>
    </div>
    <script>
      var canvas = document.getElementById('unity-canvas');
      var loadingProgress = 0;
      var loadingFinished = false;
      var loadingEnglish = !/^ru(?:-|$)/i.test(navigator.language || 'ru');
      if (loadingEnglish) {
        document.getElementById('loading-title').src = 'loading-title-en.png';
        document.getElementById('loading-title').alt = 'Loading…';
        document.getElementById('loading-screen').setAttribute('aria-label', 'Loading game');
      }
      window.updateGameLoadingProgress = function (progress) {
        if (loadingFinished) return;
        loadingProgress = Math.max(loadingProgress, Math.min(1, Math.max(0, progress)));
        var value = Math.round(loadingProgress * 100);
        var fill = document.getElementById('loading-fill');
        var bar = document.getElementById('loading-progress');
        if (fill) fill.style.clipPath = 'inset(0 ' + (100 - value) + '% 0 0)';
        if (bar) bar.setAttribute('aria-valuenow', value);
      };
      window.hideGameLoadingScreen = function () {
        window.updateGameLoadingProgress(1);
        loadingFinished = true;
        var screen = document.getElementById('loading-screen');
        if (screen) screen.remove();
      };
      function loadingFailed(error) {
        console.error(error);
        var message = document.getElementById('loading-error');
        if (message) {
          message.hidden = false;
          message.textContent = loadingEnglish ? 'Unable to load the game. Please refresh the page.' : 'Не удалось загрузить игру. Обновите страницу.';
        }
      }
      function startUnity() {
        createUnityInstance(canvas, {
        arguments: [],
        dataUrl: 'Build/FindObjectVK.data.unityweb',
        frameworkUrl: 'Build/FindObjectVK.framework.js.unityweb',
        codeUrl: 'Build/FindObjectVK.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: "MikoGamesStudio",
        productName: "Найди капибар Поиск предметов",
        productVersion: "1.0",
        matchWebGLToCanvasSize: true
        }, function (progress) {
          window.updateGameLoadingProgress(progress * .9);
        }).then(function (instance) {
        window.unityInstance = instance;
        // Unity closes the overlay only after its menu or first level is ready.
        }).catch(loadingFailed);
      }
      // Paint the loading screen before downloading/executing Unity's loader.
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        var script = document.createElement('script');
        script.src = 'Build/FindObjectVK.loader.js';
        script.onload = startUnity;
        script.onerror = loadingFailed;
        document.body.appendChild(script);
      }); });
    </script>
  </body>
</html>
